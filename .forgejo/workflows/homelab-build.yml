name: Forgejo - Build & push AuthorWorks images

# Self-hosted CI: builds the three homelab images on the Forgejo Actions
# runner (DinD sidecar) and pushes them to the Forgejo container registry
# (git.leopaska.xyz/leo/authorworks-*). ArgoCD Image Updater watches the
# immutable sha-<commit> tag. GitHub Actions (.github/workflows/docker-homelab.yml)
# remains as emergency fallback CI only.

on:
  push:
    branches: [main]
    paths:
      - "frontend/app/**"
      - "core/book-generator/**"
      - "workers/content/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "services/**"
      - ".forgejo/workflows/homelab-build.yml"
  workflow_dispatch: {}

env:
  REGISTRY_PUBLIC: git.leopaska.xyz
  REGISTRY_INTERNAL: forgejo-http.forgejo.svc.cluster.local:3000

jobs:
  # Test gate: image builds only run when unit tests and type checks pass.
  test-rust:
    runs-on: docker
    container: rust:1-bookworm
    steps:
      - name: Run book-generator unit tests
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth for the Forgejo cargo registry (homelab-inference). The registry
          # itself is declared in the repo-root .cargo/config.toml.
          CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.CARGO_REGISTRY_TOKEN }}"
        run: |
          set -eu
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "http://${GITHUB_ACTOR}:${REPO_TOKEN}@${REGISTRY_INTERNAL}/${GITHUB_REPOSITORY}.git" repo
          cd repo/core/book-generator
          # Explicit native target: the workspace .cargo/config.toml defaults
          # to wasm32-wasi for the legacy Spin services.
          cargo test --bin book-generator-server --target x86_64-unknown-linux-gnu

  test-frontend:
    runs-on: docker
    container: node:20-alpine
    steps:
      - name: Type-check the Next.js app
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          apk add --no-cache git
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "http://${GITHUB_ACTOR}:${REPO_TOKEN}@${REGISTRY_INTERNAL}/${GITHUB_REPOSITORY}.git" repo
          cd repo/frontend/app
          npm ci --no-audit --no-fund
          npx tsc --noEmit

  build-and-push:
    needs: [test-rust, test-frontend]
    runs-on: docker
    strategy:
      # One image at a time: the runner pool shares a single DinD sidecar,
      # and the Rust images are heavy. Serial keeps the builds reliable.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - image: authorworks-frontend
            context: frontend/app
            dockerfile: frontend/app/Dockerfile
          - image: authorworks-book-generator
            context: core/book-generator
            dockerfile: core/book-generator/Dockerfile
          - image: authorworks-content-worker
            context: .
            dockerfile: workers/content/Dockerfile

    steps:
      - name: Build ${{ matrix.image }} and push via skopeo
        env:
          # The workflow token reads the repo; package writes use the shared
          # leo-owned PAT from Forgejo Actions secrets (org-level).
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_TOKEN: ${{ secrets.FORGEJOPACKAGES }}
          # Auth for the Forgejo cargo registry (book-generator pulls
          # homelab-inference). Unused by the frontend/content-worker images.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # docker:27.5.1-cli reaches the DinD sidecar via the bridge gateway.
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          set -eu
          apk add --no-cache git skopeo
          # Clone over the cluster-internal Forgejo URL to avoid public-registry
          # chunked upload issues seen with Docker 27+.
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "http://${GITHUB_ACTOR}:${REPO_TOKEN}@${REGISTRY_INTERNAL}/${GITHUB_REPOSITORY}.git" repo
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          img="${REGISTRY_PUBLIC}/leo/${{ matrix.image }}"

          docker build \
            --build-arg FORGEJO_CARGO_TOKEN="${CARGO_REGISTRY_TOKEN}" \
            --tag "${img}:sha-${short_sha}" \
            --tag "${img}:homelab" \
            --file "repo/${{ matrix.dockerfile }}" \
            "repo/${{ matrix.context }}"

          for tag in "sha-${short_sha}" homelab; do
            archive="/tmp/${{ matrix.image }}-${tag}.tar"
            docker save "${img}:${tag}" -o "${archive}"
            skopeo copy --dest-tls-verify=false \
              --dest-creds "leo:${PACKAGE_TOKEN}" \
              "docker-archive:${archive}:${img}:${tag}" \
              "docker://${REGISTRY_INTERNAL}/leo/${{ matrix.image }}:${tag}"
            rm -f "${archive}"
          done
