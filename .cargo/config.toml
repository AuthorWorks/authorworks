[build]
target = "wasm32-wasi"

[target.wasm32-wasi]
runner = "spin up --listen 127.0.0.1:3000"
rustflags = ["-C", "link-arg=--max-memory=4294967296"]

[alias]
wasm-build = "build --target wasm32-wasi --release"
wasm-check = "check --target wasm32-wasi"
spin-build = "build --target wasm32-wasi --release --workspace"

[env]
RUST_LOG = "info"

[registries]
crates-io = { index = "https://github.com/rust-lang/crates.io-index" }
# Private Forgejo cargo registry serving homelab-inference (book-generator dep).
# Auth via the CARGO_REGISTRIES_FORGEJO_TOKEN env var (Bearer <token>).
forgejo = { index = "sparse+https://git.leopaska.xyz/api/packages/leo/cargo/" }

[registry]
global-credential-providers = ["cargo:token"]