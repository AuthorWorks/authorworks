# Content worker: polls content.generation_jobs, same DB as API.
# DISABLED in v1 (replicas: 0). The current frontend generates outlines inline
# and runs full-book generation through the book-generator HTTP service, so
# nothing enqueues content.generation_jobs. Enabling it would also require the
# `content.*` schema, which the frontend's Logto (string) user-id path is not
# compatible with (it expects content.books.author_id::uuid). Re-enable only
# alongside a Spin content service that owns the content schema.
# NOTE: ArgoCD ignores /spec/replicas (see applicationset.yaml), so this is
# also enforced live via `kubectl scale ... --replicas=0`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorworks-content-worker
  namespace: authorworks
  labels:
    app: authorworks-content-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: authorworks-content-worker
  template:
    metadata:
      labels:
        app: authorworks-content-worker
    spec:
      # Image is published as linux/amd64 only; pin the workload to amd64
      # nodes (homelab `hailo` is arm64).
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: content-worker
          image: ghcr.io/authorworks/content-worker
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: authorworks-secrets
                  key: database-url
            - name: LLM_PROVIDER
              value: "ollama"
            - name: OLLAMA_HOST
              value: "http://192.168.1.200"
            - name: OLLAMA_PORT
              value: "11434"
            - name: MODEL
              value: "deepseek-coder-v2:16b"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: authorworks-secrets
                  key: anthropic-api-key
                  optional: true
            - name: RUST_LOG
              value: "content_worker=info,book_generator=info"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      imagePullSecrets:
        - name: ghcr-pull-secret
---
# No Service needed - worker is poll-based, no incoming HTTP.
